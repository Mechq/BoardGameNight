# .github/workflows/deploy-presentation.yml

name: Build and Deploy – Presentation Web Project

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install npm dependencies
        working-directory: ./Presentation
        run: npm ci

      - name: Restore dependencies
        run: dotnet restore ./Presentation/Presentation.csproj

      - name: Build
        run: dotnet build ./Presentation/Presentation.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./Presentation/Presentation.csproj -c Release -o ./publish

      - name: Upload published app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: presentation-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ServerSide-Web-Programming'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5DE8B11889BE453C9C8D4AAF605FAB78 }}
          package: .
