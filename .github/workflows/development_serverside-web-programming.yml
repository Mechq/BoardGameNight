# .github/workflows/deploy-presentation.yml

name: Build and Deploy - ServerSide-Web-Programming (Presentation)

on:
  push:
    branches:
      - development   # Trigger deployment when pushing to 'development'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./Presentation/ServerSide-Web-Programming/ServerSide-Web-Programming.csproj

      - name: Build
        run: dotnet build ./Presentation/ServerSide-Web-Programming/ServerSide-Web-Programming.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./Presentation/ServerSide-Web-Programming/ServerSide-Web-Programming.csproj -c Release -o ./publish

      - name: Upload published app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: presentation-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ServerSide-Web-Programming'    # Azure App Service name
          slot-name: 'Production'                   # Or 'staging' if you use slots
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5DE8B11889BE453C9C8D4AAF605FAB78 }}
          package: .
